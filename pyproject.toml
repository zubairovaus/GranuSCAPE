[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "granuscape"
version = "0.1.0rc5"
description = "Layer-aware cellular morphometry and spatial profiling of fluorescent granules"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.2", "h5py>=3.10", "scikit-image>=0.23", "scikit-learn>=1.4", "czifile>=2019.7.2", "PyYAML>=6", "matplotlib>=3.8", "Pillow>=10"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
granuscape = "granuscape.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
granuscape = ["models/*.ilp"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
